name: Build container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - handler.py
      - runpod_minimax_compat/**
      - .github/workflows/build-container.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BASE_IMAGE=runpod/comfyui-wizard:kd77mz3yg6s68yyyerb3pg6a018f2qte
          tags: |
            ghcr.io/${{ github.repository_owner }}/runpod-minimax-video-worker:latest
            ghcr.io/${{ github.repository_owner }}/runpod-minimax-video-worker:compat-v1
          provenance: false
          sbom: false
